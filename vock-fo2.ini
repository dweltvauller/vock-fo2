; V.O.C.K. Fallout 2 settings
; Put this file in the game's mods\ folder, next to the vock-fo2 .dat files.
; 1 = on, 0 = off. If this file or a setting is missing, that addition is on.

[Additions]
; Lines VOCK adds that are not in vanilla Fallout 2.

; Post-endgame easter-egg floats: once the Enclave is destroyed, Arthur,
; Skeeter, Vegeir and Happy Harry say a bonus line when you are within 10
; hexes of them.
; Once Horrigan is dead, Sergeant Granite says a bonus line when you talk to
; him instead of his rally lines.
PostEndgameFloats=1

; Seconds between post-endgame floats, in game time. Minimum 5. Default 10.
; Applies to Arthur, Skeeter, Vegeir and Happy Harry only.
PostEndgameSeconds=10

; Darion (Vault 15) greets you with a taunt that matches your karma: the
; original line for good karma, new lines for neutral and bad karma.
; 0 = the original line for every karma.
DarionKarmaLines=1

; The Sacred Head (special encounter) talks in the dialogue window with its
; own talking head instead of floating text.
; 0 = the floating text from RPU and vanilla Fallout 2.
SacredHead=1
