; V.O.C.K. Fallout 2 settings
; Put this file in the game's mods\ folder, next to the vock-fo2 .dat files.

[Floats]
; Post-endgame easter-egg floats: once the Enclave is destroyed, Arthur,
; Skeeter and Vegeir say a bonus line when you are within 10 hexes of them.
; These lines are VOCK additions, not vanilla Fallout 2 content.
; 1 = on, 0 = off. If this file or setting is missing, the floats are on.
PostEndgame=1

; Seconds between floats, in game time. Minimum 5. Default 10.
PostEndgameSeconds=10
