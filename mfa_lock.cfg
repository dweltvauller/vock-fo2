# V.O.C.K. — MFA alignment lock file
#
# List audio tags here (one per line) whose TextGrid must NEVER be
# regenerated by the 'mfa' step. The existing TextGrid on disk is kept
# as-is and the file is excluded from its NPC's MFA batch entirely, so it
# also can't skew the pooled per-speaker normalization for the rest of
# that batch.
#
# Use this after hand-fixing a TextGrid that MFA keeps getting wrong on
# a full pipeline re-run — most commonly a batch-alignment artifact: one
# acoustically unusual line (dramatic pacing, a big pause, a held vowel)
# throws off the pooled speaker-normalization stats for its whole NPC
# group, corrupting that line's alignment even though the other lines in
# the batch stay fine. Re-aligning the file alone (outside the group)
# usually fixes it; add it here so the fix survives future runs. If you
# ever want MFA to re-align a locked line (e.g. you edited its audio or
# text), remove it from this list first.
#
# Example:
#   arth2   # batch-alignment artifact — first "the" absorbed ~1.7s of
#           # audio when aligned together with the rest of arth's lines;
#           # fixed by aligning arth2 alone. Fine to unlock and re-align
#           # if arth2's audio/text ever changes.

