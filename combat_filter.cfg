# V.O.C.K. -- Combat-bark message definition file
#
# Same format as float_filter.cfg:  prefix  spec   (comma-separated tag
# numbers and/or ranges). Numbers are the numeric suffix of the audio tag,
# NOT MSG line numbers.
#   grani  16-24   ->  tags grani16 through grani24
#
# Combat barks extend an NPC's own numbered tag sequence, live in that NPC's
# speech folder, are ACM-only (no MFA, no LIP), and are packed into a
# separate opt-out vock_combat.dat. The bark text itself must be in
# combatai_Mod.msg (data/text/english/game/), not per-NPC dialogue.
#
# No combat-bark content yet -- add entries here when it exists.
